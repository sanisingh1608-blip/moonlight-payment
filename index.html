<style>
#ml-banner{background:#111;color:#ffd54a;text-align:center;padding:12px;font-size:17px;font-weight:800;position:relative;z-index:9999}
#ml-cart{position:fixed;right:15px;bottom:15px;z-index:99999;background:#111;color:#fff;padding:12px 16px;border-radius:30px;box-shadow:0 4px 20px #0008;font-weight:800;cursor:pointer}
#ml-cart b{color:#ffd54a}
#ml-modal{display:none;position:fixed;inset:0;background:#0009;z-index:100000;padding:15px;overflow:auto}
#ml-box{background:#fff;max-width:600px;margin:20px auto;padding:20px;border-radius:15px;color:#222}
#ml-box input,#ml-box textarea,#ml-box select{width:100%;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.ml-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #ddd}
.ml-qty button{padding:3px 9px;margin:0 3px}
#ml-pay{width:100%;padding:14px;background:#138a36;color:#fff;border:0;border-radius:9px;font-size:18px;font-weight:800}
#ml-close{float:right;background:#ddd;border:0;border-radius:50%;padding:6px 10px}
</style>

<div id="ml-banner">
🛵 DIRECT ORDER KAREIN — Zomato/Swiggy Se 20–25% Tak Sasta 💰
</div>

<div id="ml-cart">🛒 CART <b id="ml-count">0</b> • ₹<b id="ml-float-total">0</b></div>

<div id="ml-modal">
<div id="ml-box">
<button id="ml-close">✕</button>
<h2>🛒 Your Order</h2>

<div id="ml-items"></div>

<hr>
<p>Food Total: <b>₹<span id="ml-total">0</span></b></p>
<p>Delivery: <b>₹<span id="ml-delivery">0</span></b></p>
<h3>Grand Total: ₹<span id="ml-total2">0</span></h3>

<label>Order Type</label>
<select id="ml-type">
<option value="delivery">Home Delivery</option>
<option value="takeaway">Takeaway</option>
</select>

<input id="ml-name" placeholder="Your Name">
<input id="ml-mobile" placeholder="Mobile Number" maxlength="10">
<textarea id="ml-address" placeholder="Full Delivery Address"></textarea>

<button id="ml-location" type="button">📍 Calculate My Delivery Charge</button>
<p id="ml-distance"></p>

<button id="ml-pay">💳 PAY NOW & CONFIRM ORDER</button>
<p id="ml-status"></p>
</div>
</div>

<script>
(function(){

const PRICE=[
130,120,120,140,260,130,250,180,350,160,90,
150,150,100,120,250,190,350,150,170,120,230,140,150,
190,190,220,200,150,180,199,90,110,99,160,199,170,299,
170,299,190,319,199,170,299,349,169,299,109,15,20,40,50,
49,59,15,20,120,149,119,129,149,149,50,119,99,129,149,139,
49,40,75,50,80,60,109,60,120,70,140,90,190,60,119,70,129,
80,149,70,129,80,129,90,159,60,109,70,129,99,149,159,79,39,39,49,59
];

const ML={
cart:{},
distance:null,
fee:0,
lat:22.3595,
lng:82.7501,
phone:"918873420907"
};

const $=id=>document.getElementById(id);
const money=n=>"₹"+Number(n||0).toFixed(0);

function idFromButton(b){
 let m=(b.getAttribute("onclick")||"").match(/add\s*\(\s*(\d+)/i);
 return m?Number(m[1]):null;
}

function cardInfo(id){
 const b=[...document.querySelectorAll(".add")].find(x=>idFromButton(x)===id);
 if(!b)return null;
 const c=b.closest(".card")||b.parentElement;
 let name=c?.querySelector(".name")?.innerText?.trim()||"Item";
 let variant=c?.querySelector(".variant")?.innerText?.trim()||"";
 return {
   id,
   name:name,
   variant:variant,
   price:PRICE[id]||0
 };
}

function total(){
 return Object.values(ML.cart).reduce((s,x)=>s+x.price*x.qty,0);
}

function render(){
 let count=0,html="";
 Object.values(ML.cart).forEach(x=>{
   count+=x.qty;
   html+=`
   <div class="ml-row">
    <div>
      <b>${x.name}</b><br>
      <small>${x.variant}</small><br>
      ${money(x.price)} × ${x.qty}
    </div>
    <div class="ml-qty">
      <button onclick="MLminus(${x.id})">−</button>
      ${x.qty}
      <button onclick="MLplus(${x.id})">+</button>
    </div>
   </div>`;
 });
 $("ml-items").innerHTML=html||"<p>Your cart is empty.</p>";
 $("ml-count").innerText=count;
 $("ml-float-total").innerText=total();
 $("ml-total").innerText=total();
 $("ml-delivery").innerText=ML.fee;
 $("ml-total2").innerText=total()+ML.fee;
}

window.MLplus=id=>{
 if(ML.cart[id])ML.cart[id].qty++;
 render();
};

window.MLminus=id=>{
 if(!ML.cart[id])return;
 ML.cart[id].qty--;
 if(ML.cart[id].qty<=0)delete ML.cart[id];
 render();
};

document.addEventListener("click",function(e){
 const b=e.target.closest(".add");
 if(!b)return;

 e.preventDefault();
 e.stopImmediatePropagation();

 const id=idFromButton(b);
 if(id===null)return;

 const item=cardInfo(id);
 if(!item)return;

 if(!ML.cart[id])ML.cart[id]={...item,qty:0};
 ML.cart[id].qty++;

 render();
},true);

$("ml-cart").onclick=()=>{
 render();
 $("ml-modal").style.display="block";
};

$("ml-close").onclick=()=>{
 $("ml-modal").style.display="none";
};

$("ml-type").onchange=()=>{
 ML.distance=null;
 ML.fee=$("ml-type").value==="takeaway"?0:0;
 $("ml-distance").innerText="";
 render();
};

$("ml-location").onclick=()=>{
 if($("ml-type").value==="takeaway"){
   ML.fee=0;
   render();
   return;
 }

 if(!navigator.geolocation){
   $("ml-distance").innerText="Location not supported.";
   return;
 }

 $("ml-distance").innerText="📍 Calculating distance...";

 navigator.geolocation.getCurrentPosition(pos=>{
   const lat=pos.coords.latitude;
   const lng=pos.coords.longitude;

   const R=6371;
   const p=Math.PI/180;
   const a=
     0.5-Math.cos((lat-ML.lat)*p)/2+
     Math.cos(ML.lat*p)*Math.cos(lat*p)*
     (1-Math.cos((lng-ML.lng)*p))/2;

   ML.distance=R*2*Math.asin(Math.sqrt(a));

   if(ML.distance<=5)ML.fee=50;
   else if(ML.distance<=10)ML.fee=80;
   else ML.fee=999999;

   $("ml-distance").innerText=
     ML.distance>10
     ?"❌ Delivery unavailable above 10 KM"
     :"📍 Distance: "+ML.distance.toFixed(2)+" KM | 🚚 Delivery Charge: ₹"+ML.fee;

   render();
 },()=>{
   $("ml-distance").innerText="❌ Please allow location permission.";
 });
};

$("ml-pay").onclick=async()=>{

 if(!Object.keys(ML.cart).length){
   $("ml-status").innerText="❌ Cart empty.";
   return;
 }

 const name=$("ml-name").value.trim();
 const mobile=$("ml-mobile").value.trim();
 const address=$("ml-address").value.trim();
 const type=$("ml-type").value;

 if(name.length<2){
   $("ml-status").innerText="❌ Name enter karein.";
   return;
 }

 if(!/^[6-9]\d{9}$/.test(mobile)){
   $("ml-status").innerText="❌ Valid 10-digit mobile number enter karein.";
   return;
 }

 if(type==="delivery"){
   if(!address){
     $("ml-status").innerText="❌ Delivery address enter karein.";
     return;
   }
   if(ML.distance===null){
     $("ml-status").innerText="❌ Pehle delivery distance calculate karein.";
     return;
   }
   if(ML.distance>10){
     $("ml-status").innerText="❌ 10 KM se zyada delivery available nahi hai.";
     return;
   }
 }

 const items=Object.values(ML.cart).map(x=>({
   id:x.id,
   qty:x.qty
 }));

 $("ml-pay").disabled=true;
 $("ml-status").innerText="⏳ Order/payment prepare ho raha hai...";

 try{

   const res=await fetch("/api/create-order",{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({
       name,
       mobile,
       address,
       orderType:type==="takeaway"?"Takeaway":"Home Delivery",
       distance:ML.distance,
       total:total()+ML.fee,
       items
     })
   });

   const data=await res.json();

   if(!res.ok||!data.success){
     throw new Error(data.error||"Order create nahi hua.");
   }

   if(!window.Razorpay){
     await new Promise((resolve,reject)=>{
       const s=document.createElement("script");
       s.src="https://checkout.razorpay.com/v1/checkout.js";
       s.onload=resolve;
       s.onerror=reject;
       document.head.appendChild(s);
     });
   }

   const rzp=new Razorpay({
     key:data.keyId,
     amount:data.amount,
     currency:data.currency,
     order_id:data.order_id,
     name:"Moonlight Biryani N Snacks",
     description:"Food Order",
     prefill:{
       name:name,
       contact:mobile
     },

     handler:async function(response){

       $("ml-status").innerText="⏳ Payment verify ho raha hai...";

       try{

         const vr=await fetch("/api/verify-payment",{
           method:"POST",
           headers:{"Content-Type":"application/json"},
           body:JSON.stringify(response)
         });

         const vd=await vr.json();

         if(!vr.ok||!vd.verified||!vd.orderConfirmed){
           throw new Error("Payment verification failed.");
         }

         const lines=Object.values(ML.cart).map(x=>
           `${x.name}${x.variant?" "+x.variant:""} × ${x.qty} = ₹${x.price*x.qty}`
         );

         const msg=[
           "🍽️ *NEW PAID ORDER*",
           "",
           "Order ID: "+data.order_id,
           "Name: "+name,
           "Mobile: "+mobile,
           "Order Type: "+(type==="takeaway"?"Takeaway":"Home Delivery"),
           ...(type==="delivery"?["Address: "+address,"Distance: "+ML.distance.toFixed(2)+" KM"]:[]),
           "",
           ...lines,
           "",
           "Food Total: ₹"+total(),
           "Delivery: ₹"+ML.fee,
           "Grand Total: ₹"+(total()+ML.fee),
           "",
           "✅ Payment Verified"
         ].join("\n");

         $("ml-status").innerHTML=
           "✅ <b>Payment Verified — Order Confirmed!</b>";

         setTimeout(()=>{
           window.open(
             "https://wa.me/"+ML.phone+"?text="+encodeURIComponent(msg),
             "_blank"
           );
         },500);

       }catch(err){
         $("ml-status").innerText=
           "❌ Payment hua ho sakta hai, lekin verification fail hua. Order confirmed nahi hai.";
       }

       $("ml-pay").disabled=false;
     },

     modal:{
       ondismiss:function(){
         $("ml-pay").disabled=false;
         $("ml-status").innerText="Payment cancelled.";
       }
     }
   });

   rzp.on("payment.failed",function(){
     $("ml-pay").disabled=false;
     $("ml-status").innerText="❌ Payment failed. Order confirm nahi hua.";
   });

   rzp.open();

 }catch(err){
   $("ml-pay").disabled=false;
   $("ml-status").innerText="❌ "+err.message;
 }
};

render();

})();
</script>
